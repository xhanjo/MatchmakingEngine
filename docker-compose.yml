version: '3.8'

services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-MatchmakingDb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api1:
    build:
      context: .
      dockerfile: MatchmakingEngine/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-MatchmakingDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Redis__Configuration=redis:6379
      - Jwt__Key=${JWT_KEY:-ThisIsMySuperSecretKeyForJwtTokens123!}
    depends_on:
      - postgres
      - redis

  # api2: (Optional replica for testing multi-instance scaling; disabled by default to save RAM on t3.small)
  #   build:
  #     context: .
  #     dockerfile: MatchmakingEngine/Dockerfile
  #   ports:
  #     - "5002:8080"
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-MatchmakingDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
  #     - Redis__Configuration=redis:6379
  #     - Jwt__Key=${JWT_KEY:-ThisIsMySuperSecretKeyForJwtTokens123!}
  #     - RunMatchmakingWorker=false 
  #   depends_on:
  #     - postgres
  #     - redis

  frontend:
    build:
      context: ./MatchmakingClient
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api1

volumes:
  pgdata: