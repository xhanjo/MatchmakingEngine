<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchEngine — Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'app-bg':       '#07080f',
                        'app-surface':  '#0d1018',
                        'app-elevated': '#131825',
                        'app-border':   '#1c2035',
                        'app-muted':    '#252a3d',
                        'brand':        '#6366f1',
                        'brand-light':  '#818cf8',
                        'brand-dark':   '#4f46e5',
                        'hi':           '#22d3ee',
                        'safe':         '#10b981',
                        'warn':         '#f59e0b',
                        'danger':       '#ef4444',
                    },
                    fontFamily: {
                        sans:    ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
</head>
<body class="bg-app-bg text-slate-300 min-h-screen flex flex-col font-sans select-none">

    <!-- ══════════════════════════════════════════
         TOP NAVBAR
         ══════════════════════════════════════════ -->
    <header class="bg-app-surface border-b border-app-border sticky top-0 z-50">
        <div class="flex items-center h-14 px-6 gap-6">

            <!-- Logo -->
            <div class="flex items-center gap-2 shrink-0">
                <div class="w-7 h-7 rounded-lg flex items-center justify-center text-white text-sm font-display font-black" style="background: linear-gradient(135deg, #6366f1, #4f46e5);">M</div>
                <span class="font-display font-bold text-base tracking-widest text-white">MATCHENGINE</span>
            </div>

            <div class="flex-1"></div>

            <!-- Right side: username + actions -->
            <div class="flex items-center gap-3" id="user-actions">
                <button
                    id="username-display"
                    onclick="App.showProfile()"
                    class="flex items-center gap-2 px-3 py-1.5 rounded-lg transition-all hover:bg-app-elevated group cursor-pointer border-0 bg-transparent"
                    title="View Profile">
                    <div class="w-7 h-7 rounded-full bg-brand flex items-center justify-center text-white text-xs font-display font-bold">?</div>
                    <span class="text-sm font-medium text-slate-200 group-hover:text-white">Player</span>
                </button>
                <button
                    id="logout-btn"
                    class="text-xs px-3 py-1.5 rounded-lg font-display font-semibold tracking-wider uppercase transition-all border border-app-border text-slate-500 hover:border-danger hover:text-danger">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- ══════════════════════════════════════════
         MAIN LAYOUT
         ══════════════════════════════════════════ -->
    <div class="flex flex-1 overflow-hidden">

        <!-- ── Left: Matchmaking Area ── -->
        <main class="flex-1 overflow-y-auto p-6 flex flex-col gap-6">

            <!-- Matchmaking Card -->
            <div class="bg-app-surface border border-app-border rounded-2xl p-10 flex flex-col items-center gap-5">

                <button id="find-match-btn" class="find-match-base find-match-idle">
                    FIND MATCH
                </button>

                <div id="match-status-text" class="text-sm text-slate-500 min-h-5 text-center tracking-wide"></div>

                <!-- ── Party / Lobby Section ── -->
                <div id="party-wrapper" class="w-full max-w-sm pt-4 mt-2 border-t border-app-border">
                    <div class="flex items-center justify-between mb-4">
                        <span class="font-display font-bold text-xs uppercase tracking-widest text-slate-500">Lobby</span>
                        <button id="create-party-btn"
                            class="text-xs px-3 py-1.5 rounded-lg font-display font-semibold uppercase tracking-wider transition-all"
                            style="background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2); color: #818cf8;">
                            + Create Duo Lobby
                        </button>
                    </div>

                    <!-- Party container (shown when in a party) -->
                    <div id="party-container" style="display:none;">
                        <div id="party-members-list" class="flex flex-col gap-2 mb-3"></div>
                        <button id="leave-party-btn"
                            class="w-full py-2 rounded-lg text-xs font-display font-bold uppercase tracking-wider transition-all"
                            style="background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.2); color: #f87171; display:none;">
                            Leave Party
                        </button>
                    </div>
                </div>
            </div>

        </main>

        <!-- ── Right: Friends & Search Sidebar ── -->
        <aside class="w-72 shrink-0 bg-app-surface border-l border-app-border flex flex-col overflow-hidden">

            <!-- Player Search -->
            <div class="p-4 border-b border-app-border">
                <p class="font-display font-bold text-xs uppercase tracking-widest text-slate-500 mb-3">Find Players</p>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-600 text-xs pointer-events-none">🔍</span>
                    <input
                        id="player-search"
                        type="text"
                        placeholder="Search by name…"
                        class="auth-input text-sm !py-2 !pl-8 !rounded-lg">
                </div>
                <div id="search-results" class="mt-2"></div>
            </div>

            <!-- Friends List -->
            <div class="flex-1 overflow-y-auto p-4">
                <p class="font-display font-bold text-xs uppercase tracking-widest text-slate-500 mb-3">Friends</p>
                <div id="pending-requests" class="mb-2"></div>
                <div id="friends-list"></div>
            </div>

        </aside>
    </div>

    <!-- ══════════════════════════════════════════
         MATCH FOUND MODAL
         ══════════════════════════════════════════ -->
    <div id="match-modal" class="modal-overlay">
        <div class="modal-card match-modal-card"
            style="background: linear-gradient(160deg, #0f1a14 0%, #07080f 100%);
                   border: 2px solid #10b981;
                   border-radius: 22px;
                   padding: 40px 36px;
                   text-align: center;
                   width: 100%;
                   max-width: 400px;">

            <p class="match-found-title font-display font-black text-safe text-3xl uppercase tracking-widest mb-6"
               style="text-shadow: 0 0 25px rgba(16,185,129,0.7);">MATCH FOUND</p>

            <!-- Countdown timer -->
            <div class="timer-container" style="position:relative; width:110px; height:110px; margin: 0 auto 28px;">
                <svg class="timer-circle" viewBox="0 0 100 100">
                    <circle class="bg-stroke" cx="50" cy="50" r="45"></circle>
                    <circle class="progress-stroke" cx="50" cy="50" r="45"></circle>
                </svg>
                <div id="timer-text"
                     class="font-display font-black text-3xl text-white"
                     style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);">30</div>
            </div>

            <div class="flex flex-col gap-3">
                <button id="accept-match-btn"
                    class="w-full py-4 rounded-xl font-display font-black text-lg uppercase tracking-widest text-white transition-all"
                    style="background: #059669; box-shadow: 0 0 25px rgba(16,185,129,0.4);">
                    ACCEPT
                </button>
                <button id="decline-match-btn"
                    class="w-full py-3 rounded-xl font-display font-bold text-sm uppercase tracking-wider transition-all"
                    style="background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.25); color: #f87171;">
                    DECLINE
                </button>
            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════════════
         PARTY INVITE MODAL
         ══════════════════════════════════════════ -->
    <div id="invite-modal" class="modal-overlay">
        <div class="modal-card bg-app-elevated border border-app-border rounded-2xl p-10 text-center max-w-sm w-full">
            <div class="text-5xl mb-5">🎮</div>
            <h2 class="font-display font-bold text-xl text-white mb-2">Party Invite</h2>
            <p id="invite-text" class="text-sm text-slate-500 mb-8">You received a party invite!</p>
            <div class="flex gap-3">
                <button id="accept-invite-btn"
                    class="flex-1 py-3 rounded-xl font-display font-bold text-sm uppercase tracking-wider text-white transition-all"
                    style="background: #6366f1;">Accept</button>
                <button id="decline-invite-btn"
                    class="flex-1 py-3 rounded-xl font-display font-bold text-sm uppercase tracking-wider transition-all"
                    style="background: rgba(255,255,255,0.04); border: 1px solid #1c2035; color: #475569;">Decline</button>
            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════════════
         PROFILE MODAL
         ══════════════════════════════════════════ -->
    <div id="profile-modal" class="modal-overlay">
        <div class="modal-card bg-app-surface border border-app-border rounded-2xl max-w-xl w-full overflow-hidden flex flex-col"
             style="max-height: 85vh;">

            <!-- Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-app-border shrink-0">
                <h2 class="font-display font-bold text-lg text-white">Player Profile</h2>
                <button onclick="document.getElementById('profile-modal').classList.remove('active')"
                    class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 hover:text-white hover:bg-app-elevated transition-all text-sm">✕</button>
            </div>

            <!-- Stats -->
            <div id="profile-stats" class="px-6 py-5 border-b border-app-border shrink-0"></div>

            <!-- Match History -->
            <div class="px-6 py-5 flex-1 overflow-y-auto">
                <p class="font-display font-bold text-xs uppercase tracking-widest text-slate-500 mb-4">Recent Matches</p>
                <div id="profile-history"></div>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/signalr-manager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
