name: CD (Deploy to EC2)

on:
  workflow_run:
    workflows: [".NET CI"]
    types:
      - completed
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Deploy to EC2 via Native OpenSSH
      env:
        RAW_KEY: ${{ secrets.EC2_SSH_KEY }}
      run: |
        # Hardcode the known Elastic IP so no secret typos/masks can break the host
        TARGET_HOST="13.50.190.113"
        echo "Connecting to EC2 at $TARGET_HOST on port 22..."

        if [ -z "$RAW_KEY" ]; then
          echo "::error::EC2_SSH_KEY secret is empty! Please check GitHub Secrets."
          exit 1
        fi

        # Setup SSH directory and write private key cleanly
        mkdir -p ~/.ssh
        echo "$RAW_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

        # Run native OpenSSH with verbose logging (-v) and 30s timeout
        ssh -v -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/id_rsa ubuntu@"$TARGET_HOST" '
          set -e
          echo "=== Connected successfully to EC2 ==="
          cd ~/MatchmakingEngine
          git pull origin main
          docker compose up -d --build
          echo "=== Deployment finished successfully! ==="
        '