<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchEngine — Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'app-bg':       '#07080f',
                        'app-surface':  '#0d1018',
                        'app-elevated': '#131825',
                        'app-border':   '#1c2035',
                        'brand':        '#6366f1',
                        'brand-light':  '#818cf8',
                        'safe':         '#10b981',
                        'warn':         '#f59e0b',
                        'danger':       '#ef4444',
                        'hi':           '#22d3ee',
                    },
                    fontFamily: {
                        sans:    ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-app-bg text-slate-300 min-h-screen flex flex-col font-sans">

    <!-- Navbar -->
    <header class="bg-app-surface border-b border-app-border sticky top-0 z-50">
        <div class="flex items-center h-14 px-6 gap-4">
            <div class="flex items-center gap-2 shrink-0">
                <div class="w-7 h-7 rounded-lg flex items-center justify-center text-white text-sm font-display font-black"
                     style="background: linear-gradient(135deg, #6366f1, #4f46e5);">M</div>
                <span class="font-display font-bold text-base tracking-widest text-white">MATCHENGINE</span>
                <span class="ml-1 px-2 py-0.5 rounded text-xs font-display font-bold uppercase tracking-wider text-danger bg-danger/10 border border-danger/20">Admin</span>
            </div>
            <div class="flex-1"></div>
            <span id="username-display" class="text-sm font-medium text-slate-400">Admin</span>
            <a href="index.html" class="text-xs px-3 py-1.5 rounded-lg font-display font-semibold tracking-wider uppercase transition-all border border-app-border text-slate-500 hover:border-brand hover:text-brand-light">
                ← Dashboard
            </a>
            <button id="logout-btn" class="text-xs px-3 py-1.5 rounded-lg font-display font-semibold tracking-wider uppercase transition-all border border-app-border text-slate-500 hover:border-danger hover:text-danger">
                Logout
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 max-w-6xl mx-auto w-full flex flex-col gap-8">

        <!-- Active Matches -->
        <section>
            <div class="flex items-center gap-3 mb-4">
                <div class="w-2 h-2 rounded-full bg-safe animate-pulse"></div>
                <h2 class="font-display font-bold text-lg text-white uppercase tracking-wider">Active Matches</h2>
            </div>
            <div class="bg-app-surface border border-app-border rounded-2xl overflow-hidden">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Match ID</th>
                            <th>Status</th>
                            <th>Avg MMR</th>
                            <th>Mode</th>
                            <th>Created</th>
                            <th>Players</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="active-matches-tbody">
                        <tr><td colspan="7" class="text-center text-slate-600 py-8">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- All Matches -->
        <section>
            <div class="flex items-center gap-3 mb-4">
                <h2 class="font-display font-bold text-lg text-white uppercase tracking-wider">All Matches</h2>
                <span id="all-matches-count" class="text-xs text-slate-500 font-display"></span>
            </div>
            <div class="bg-app-surface border border-app-border rounded-2xl overflow-hidden">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Match ID</th>
                            <th>Status</th>
                            <th>Avg MMR</th>
                            <th>Mode</th>
                            <th>Created</th>
                            <th>Players</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="all-matches-tbody">
                        <tr><td colspan="7" class="text-center text-slate-600 py-8">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Registered Players -->
        <section>
            <div class="flex items-center gap-3 mb-4">
                <h2 class="font-display font-bold text-lg text-white uppercase tracking-wider">Registered Players</h2>
            </div>
            <div class="bg-app-surface border border-app-border rounded-2xl overflow-hidden">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Region</th>
                            <th>MMR</th>
                            <th>Trust Factor</th>
                        </tr>
                    </thead>
                    <tbody id="players-tbody">
                        <tr><td colspan="5" class="text-center text-slate-600 py-8">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <div id="toast-container" class="toast-container"></div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="js/signalr-manager.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
