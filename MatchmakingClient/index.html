<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchmaking Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
</head>
<body>
    <div class="container">
        <div id="auth-section">
            <h2>Авторизація</h2>
            <div class="form-group">
                <input type="text" id="username" placeholder="Username">
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password">
            </div>
            <div class="form-group">
                <select id="region">
                    <option value="1">Europe West (EU)</option>
                    <option value="2">Europe East (EUE)</option>
                    <option value="3">North America (NA)</option>
                    <option value="4">Asia</option>
                </select>
            </div>
            <button onclick="login()">Увійти</button>
            <button onclick="register()" class="secondary">Зареєструватися</button>
            <p id="auth-error" class="error"></p>
        </div>

        <div id="lobby-section" style="display: none;">
            
            <div class="profile-card">
                <img src="" alt="Avatar" class="avatar" id="player-avatar">
                <div class="profile-info">
                    <h3 id="player-name">Loading...</h3>
                    <p class="rating">MMR: <span id="player-mmr">---</span></p>
                </div>
            </div>

            <div class="matchmaking-controls">
                <button id="find-match-btn" onclick="findMatch()">Знайти матч</button>
                <button id="cancel-match-btn" onclick="cancelMatch()" class="danger" style="display: none;">Відмінити пошук</button>
            </div>
            
            <p id="match-status"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
